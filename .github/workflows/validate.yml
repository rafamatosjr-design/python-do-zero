name: Validar aplicativo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar dados das aulas
        run: node scripts/validate-data.js

      - name: Conferir sintaxe JavaScript
        run: |
          for arquivo in *.js scripts/*.js; do
            node --check "$arquivo"
          done

      - name: Executar smoke test estático
        run: node scripts/smoke-static.js
